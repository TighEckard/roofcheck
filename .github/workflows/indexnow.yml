# Tells IndexNow search engines (Bing, which feeds ChatGPT search, plus Yandex and others)
# about the site's pages after each GitHub Pages deploy. Sends only public page URLs.
name: indexnow
on:
  workflow_run:
    workflows: ["pages-build-deployment"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ping:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Submit sitemap URLs to IndexNow
        run: |
          KEY=$(grep -oP 'INDEXNOW_KEY = "\K[0-9a-f]+' tools/build.py)
          python3 - "$KEY" <<'PY'
          import json, re, sys
          key = sys.argv[1]
          urls = re.findall(r"<loc>([^<]+)</loc>", open("sitemap.xml").read())
          body = {"host": "bedrockroof.com", "key": key, "keyLocation": f"https://bedrockroof.com/{key}.txt", "urlList": urls}
          open("indexnow.json", "w").write(json.dumps(body))
          print(len(urls), "urls")
          PY
          curl -sS -o /dev/null -w "IndexNow HTTP %{http_code}\n" -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" --data @indexnow.json
